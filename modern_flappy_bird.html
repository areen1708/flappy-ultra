<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Flappy Bird</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-glow {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            transition: all 0.2s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.8);
            transform: translateY(-2px);
        }
        .btn-glow:active {
            transform: translateY(1px);
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }
        .pulse-anim {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay Container -->
    <div id="uiContainer" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        
        <!-- Top HUD -->
        <div id="hudTop" class="flex justify-between items-center w-full max-w-md mx-auto pointer-events-auto opacity-0 transition-opacity duration-300">
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 shadow-lg">
                <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-trophy text-sm"></i>
                </div>
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Best Score</div>
                    <div id="hudBest" class="text-lg font-black text-amber-400">0</div>
                </div>
            </div>

            <div class="glass-panel px-6 py-2 rounded-2xl flex flex-col items-center shadow-lg">
                <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Score</div>
                <div id="hudScore" class="text-3xl font-black text-white">0</div>
            </div>

            <div class="flex gap-2">
                <button onclick="toggleSound()" id="soundBtn" class="glass-panel w-11 h-11 rounded-2xl flex items-center justify-center text-slate-200 hover:text-white transition hover:bg-slate-800">
                    <i class="fa-solid fa-volume-high text-lg" id="soundIcon"></i>
                </button>
                <button onclick="pauseGame()" class="glass-panel w-11 h-11 rounded-2xl flex items-center justify-center text-slate-200 hover:text-white transition hover:bg-slate-800">
                    <i class="fa-solid fa-pause text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Center Notification / Instructions -->
        <div id="centerPrompt" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto transition-all duration-300 bg-slate-950/40 backdrop-blur-sm">
            <!-- Main Menu / Start Screen -->
            <div id="menuScreen" class="glass-panel p-8 rounded-3xl max-w-sm w-full mx-4 text-center shadow-2xl border border-white/10 flex flex-col items-center">
                <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-xl shadow-amber-500/30 mb-6 pulse-anim">
                    <i class="fa-solid fa-crow text-3xl text-slate-950"></i>
                </div>
                <h1 class="text-3xl font-black tracking-tight mb-1 bg-gradient-to-r from-white via-slate-200 to-amber-300 bg-clip-text text-transparent">FLAPPY ULTRA</h1>
                <p class="text-slate-400 text-sm mb-8">Ultra-sensitive, modern physics & precision gameplay</p>

                <button onclick="startGame()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 font-bold text-white text-lg btn-glow flex items-center justify-center gap-3 mb-4">
                    <i class="fa-solid fa-play"></i> Tap to Play
                </button>

                <div class="grid grid-cols-2 gap-3 w-full">
                    <button onclick="openShop()" class="glass-panel py-3 px-4 rounded-xl font-semibold text-sm text-slate-300 hover:text-white flex items-center justify-center gap-2 transition hover:bg-slate-800">
                        <i class="fa-solid fa-shirt text-amber-400"></i> Skins & Pets
                    </button>
                    <button onclick="openAchievements()" class="glass-panel py-3 px-4 rounded-xl font-semibold text-sm text-slate-300 hover:text-white flex items-center justify-center gap-2 transition hover:bg-slate-800">
                        <i class="fa-solid fa-medal text-yellow-400"></i> Badges
                    </button>
                </div>
            </div>

            <!-- Game Over Screen (Hidden initially) -->
            <div id="gameOverScreen" class="glass-panel p-8 rounded-3xl max-w-sm w-full mx-4 text-center shadow-2xl border border-white/10 hidden flex flex-col items-center">
                <div class="text-red-400 font-black text-xl mb-1 tracking-wider uppercase">Crash!</div>
                <h2 class="text-4xl font-black mb-6 text-white">Game Over</h2>

                <div class="grid grid-cols-2 gap-4 w-full mb-6">
                    <div class="glass-panel p-4 rounded-2xl bg-slate-900/50">
                        <div class="text-[11px] text-slate-400 font-semibold uppercase mb-1">Score</div>
                        <div id="finalScore" class="text-3xl font-black text-white">0</div>
                    </div>
                    <div class="glass-panel p-4 rounded-2xl bg-slate-900/50">
                        <div class="text-[11px] text-slate-400 font-semibold uppercase mb-1">Best</div>
                        <div id="finalBest" class="text-3xl font-black text-amber-400">0</div>
                    </div>
                </div>

                <div id="medalContainer" class="mb-6 hidden flex items-center justify-center gap-3 px-4 py-2 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-sm font-bold">
                    <i id="medalIcon" class="fa-solid fa-medal text-xl text-amber-400"></i>
                    <span id="medalText">New Milestone Reached!</span>
                </div>

                <div class="flex gap-3 w-full">
                    <button onclick="restartGame()" class="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 font-bold text-white btn-glow flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Retry
                    </button>
                    <button onclick="returnToMenu()" class="glass-panel py-4 px-5 rounded-2xl font-bold text-slate-300 hover:text-white flex items-center justify-center transition hover:bg-slate-800">
                        <i class="fa-solid fa-house"></i>
                    </button>
                </div>
            </div>

            <!-- Pause Screen (Hidden initially) -->
            <div id="pauseScreen" class="glass-panel p-8 rounded-3xl max-w-sm w-full mx-4 text-center shadow-2xl border border-white/10 hidden flex flex-col items-center">
                <h2 class="text-3xl font-black mb-6 text-white">Game Paused</h2>
                <button onclick="resumeGame()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 font-bold text-white text-lg btn-glow flex items-center justify-center gap-3 mb-3">
                    <i class="fa-solid fa-play"></i> Resume
                </button>
                <button onclick="returnToMenu()" class="w-full py-3 px-6 rounded-2xl glass-panel font-semibold text-slate-300 hover:text-white flex items-center justify-center gap-2 hover:bg-slate-800 transition">
                    <i class="fa-solid fa-house"></i> Main Menu
                </button>
            </div>

            <!-- Shop Modal (Hidden initially) -->
            <div id="shopModal" class="glass-panel p-6 rounded-3xl max-w-md w-full mx-4 shadow-2xl border border-white/10 hidden flex flex-col max-h-[80vh]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-black text-white flex items-center gap-2"><i class="fa-solid fa-shirt text-amber-400"></i> Bird Skins</h3>
                    <button onclick="closeShop()" class="text-slate-400 hover:text-white w-8 h-8 rounded-full flex items-center justify-center glass-panel"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <p class="text-xs text-slate-400 mb-4">Unlock custom birds with your high scores!</p>
                <div id="skinsList" class="grid grid-cols-1 gap-3 overflow-y-auto pr-1 flex-1 mb-4">
                    <!-- Dynamic skin items inserted here -->
                </div>
                <button onclick="closeShop()" class="w-full py-3 rounded-2xl bg-slate-800 font-bold text-slate-200 hover:bg-slate-700 transition">Back</button>
            </div>

            <!-- Achievements Modal (Hidden initially) -->
            <div id="achievementsModal" class="glass-panel p-6 rounded-3xl max-w-md w-full mx-4 shadow-2xl border border-white/10 hidden flex flex-col max-h-[80vh]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-black text-white flex items-center gap-2"><i class="fa-solid fa-medal text-yellow-400"></i> Milestones</h3>
                    <button onclick="closeAchievements()" class="text-slate-400 hover:text-white w-8 h-8 rounded-full flex items-center justify-center glass-panel"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="achievementsList" class="grid grid-cols-1 gap-3 overflow-y-auto pr-1 flex-1 mb-4">
                    <!-- Dynamic achievements inserted here -->
                </div>
                <button onclick="closeAchievements()" class="w-full py-3 rounded-2xl bg-slate-800 font-bold text-slate-200 hover:bg-slate-700 transition">Back</button>
            </div>
        </div>

        <!-- Bottom Controls / Indicator for touch -->
        <div id="tapIndicator" class="w-full text-center pointer-events-none opacity-60 pb-4 transition-opacity duration-300">
            <div class="inline-block glass-panel px-4 py-2 rounded-full text-xs font-semibold text-slate-300 animate-bounce">
                Tap anywhere or press Space to Flap
            </div>
        </div>
    </div>

    <script>
        // --- Game Audio Synthesizer (Web Audio API) ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high text-lg";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-lg text-slate-500";
            }
        }

        // --- Game Setup & Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game States: 'MENU', 'PLAYING', 'PAUSED', 'GAMEOVER'
        let gameState = 'MENU';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_high') || '0');
        document.getElementById('hudBest').innerText = highScore;

        // Skins definitions
        const skins = [
            { id: 'classic', name: 'Golden Flash', color: '#fbbf24', belly: '#fef08a', unlocked: true, price: 0 },
            { id: 'neon', name: 'Cyber Neon', color: '#38bdf8', belly: '#bae6fd', unlocked: false, price: 10 },
            { id: 'ruby', name: 'Ruby Phoenix', color: '#f43f5e', belly: '#fecdd3', unlocked: false, price: 25 },
            { id: 'emerald', name: 'Emerald Spirit', color: '#10b981', belly: '#a7f3d0', unlocked: false, price: 50 }
        ];
        let currentSkinId = localStorage.getItem('flappy_skin') || 'classic';

        // Achievements definitions
        const achievements = [
            { id: 'score_5', title: 'Novice Flier', desc: 'Reach a score of 5', target: 5, unlocked: false },
            { id: 'score_15', title: 'Sky Master', desc: 'Reach a score of 15', target: 15, unlocked: false },
            { id: 'score_30', title: 'Bird Whisperer', desc: 'Reach a score of 30', target: 30, unlocked: false },
            { id: 'score_50', title: 'Legendary Ace', desc: 'Reach a score of 50', target: 50, unlocked: false }
        ];
        
        // Load saved achievements data
        try {
            const savedAch = JSON.parse(localStorage.getItem('flappy_ach') || '{}');
            achievements.forEach(a => { if (savedAch[a.id]) a.unlocked = true; });
            const savedSkins = JSON.parse(localStorage.getItem('flappy_skins') || '[]');
            skins.forEach(s => { if (savedSkins.includes(s.id)) s.unlocked = true; });
        } catch(e) {}

        // --- Bird Physics & Properties ---
        let bird = {
            x: width * 0.25,
            y: height * 0.5,
            radius: 18,
            velocity: 0,
            gravity: 0.38,       // Balanced for silky smoothness & responsiveness
            lift: -8.2,          // Crisp jump response
            rotation: 0,
            targetRotation: 0
        };

        // Pipes & Environment
        let pipes = [];
        let pipeWidth = 75;
        let pipeGap = 170;
        let pipeTimer = 0;
        let pipeInterval = 100; // frames between pipes (~1.6s)
        let gameSpeed = 3.8;

        // Particles for explosions, trails & jumps
        let particles = [];
        class Particle {
            constructor(x, y, color, speedScale = 1) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6 * speedScale;
                this.vy = (Math.random() - 0.5) * 6 * speedScale;
                this.radius = Math.random() * 4 + 2;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw(context) {
                context.save();
                context.globalAlpha = Math.max(0, this.alpha);
                context.fillStyle = this.color;
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }
        }

        // Background Clouds & Stars
        let backgroundElements = [];
        for (let i = 0; i < 8; i++) {
            backgroundElements.push({
                x: Math.random() * width,
                y: Math.random() * (height * 0.7),
                speed: Math.random() * 0.5 + 0.2,
                size: Math.random() * 40 + 20
            });
        }

        // --- Input Controls (Ultra-Sensitive & Instant) ---
        function triggerJump(e) {
            if (e) e.preventDefault();
            if (gameState === 'PLAYING') {
                bird.velocity = bird.lift;
                playSound('jump');
                // Create jump particles
                for (let i = 0; i < 5; i++) {
                    particles.push(new Particle(bird.x - 10, bird.y + 10, '#ffffff', 0.8));
                }
            } else if (gameState === 'MENU') {
                startGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                triggerJump(e);
            }
        });

        window.addEventListener('pointerdown', (e) => {
            // Ignore if clicking UI buttons
            if (e.target.closest('button') || e.target.closest('#shopModal') || e.target.closest('#achievementsModal')) return;
            triggerJump(e);
        });

        // --- Game Control Functions ---
        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            document.getElementById('hudScore').innerText = '0';
            document.getElementById('centerPrompt').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('hudTop').classList.remove('opacity-0');
            document.getElementById('tapIndicator').style.opacity = '0';

            // Reset bird & pipes
            bird.x = width < 500 ? width * 0.3 : width * 0.25;
            bird.y = height * 0.5;
            bird.velocity = 0;
            pipes = [];
            pipeTimer = 0;
            particles = [];
        }

        function pauseGame() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('centerPrompt').classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('pauseScreen').classList.remove('hidden');
            }
        }

        function resumeGame() {
            if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('centerPrompt').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('pauseScreen').classList.add('hidden');
            }
        }

        function restartGame() {
            startGame();
        }

        function returnToMenu() {
            gameState = 'MENU';
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('shopModal').classList.add('hidden');
            document.getElementById('achievementsModal').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('centerPrompt').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('hudTop').classList.add('opacity-0');
            document.getElementById('tapIndicator').style.opacity = '0.6';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSound('hit');
            document.getElementById('hudTop').classList.add('opacity-0');
            document.getElementById('centerPrompt').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('gameOverScreen').classList.remove('hidden');

            document.getElementById('finalScore').innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_high', highScore);
            }
            document.getElementById('finalBest').innerText = highScore;
            document.getElementById('hudBest').innerText = highScore;

            // Check Milestones / Achievements & Skin Unlocks
            checkAchievementsAndRewards();

            // Death burst particles
            for (let i = 0; i < 30; i++) {
                const activeSkin = skins.find(s => s.id === currentSkinId) || skins[0];
                particles.push(new Particle(bird.x, bird.y, activeSkin.color, 1.8));
            }
        }

        // --- Shop & Achievements Modals ---
        function openShop() {
            renderShopList();
            document.getElementById('shopModal').classList.remove('hidden');
        }
        function closeShop() {
            document.getElementById('shopModal').classList.add('hidden');
        }

        function openAchievements() {
            renderAchievementsList();
            document.getElementById('achievementsModal').classList.remove('hidden');
        }
        function closeAchievements() {
            document.getElementById('achievementsModal').classList.add('hidden');
        }

        function renderShopList() {
            const container = document.getElementById('skinsList');
            container.innerHTML = '';
            skins.forEach(skin => {
                const isSelected = skin.id === currentSkinId;
                const canUnlock = highScore >= skin.price;
                
                let btnHtml = '';
                if (skin.unlocked) {
                    btnHtml = isSelected 
                        ? `<span class="px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 font-bold text-xs">Equipped</span>`
                        : `<button onclick="selectSkin('${skin.id}')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition">Select</button>`;
                } else {
                    btnHtml = canUnlock
                        ? `<button onclick="unlockSkin('${skin.id}')" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition">Unlock</button>`
                        : `<span class="px-4 py-2 rounded-xl bg-slate-800 text-slate-500 font-bold text-xs">Best: ${skin.price}</span>`;
                }

                const item = document.createElement('div');
                item.className = `glass-panel p-4 rounded-2xl flex items-center justify-between border ${isSelected ? 'border-amber-500/50 bg-amber-500/5' : 'border-white/5'}`;
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-md" style="background:${skin.color}">
                            <div class="w-4 h-4 rounded-full bg-white/40"></div>
                        </div>
                        <div>
                            <div class="font-bold text-sm text-white">${skin.name}</div>
                            <div class="text-[11px] text-slate-400">${skin.unlocked ? 'Unlocked' : 'Req: ' + skin.price + ' Best Score'}</div>
                        </div>
                    </div>
                    ${btnHtml}
                `;
                container.appendChild(item);
            });
        }

        function selectSkin(id) {
            currentSkinId = id;
            localStorage.setItem('flappy_skin', id);
            renderShopList();
        }

        function unlockSkin(id) {
            const skin = skins.find(s => s.id === id);
            if (skin && highScore >= skin.price) {
                skin.unlocked = true;
                localStorage.setItem('flappy_skins', JSON.stringify(skins.filter(s => s.unlocked).map(s => s.id)));
                selectSkin(id);
            }
        }

        function renderAchievementsList() {
            const container = document.getElementById('achievementsList');
            container.innerHTML = '';
            achievements.forEach(ach => {
                const item = document.createElement('div');
                item.className = `glass-panel p-4 rounded-2xl flex items-center justify-between border ${ach.unlocked ? 'border-yellow-500/30 bg-yellow-500/5' : 'border-white/5'}`;
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center ${ach.unlocked ? 'bg-yellow-500/20 text-yellow-400' : 'bg-slate-800 text-slate-600'} text-lg">
                            <i class="fa-solid fa-medal"></i>
                        </div>
                        <div>
                            <div class="font-bold text-sm text-white">${ach.title}</div>
                            <div class="text-[11px] text-slate-400">${ach.desc}</div>
                        </div>
                    </div>
                    <div>
                        ${ach.unlocked ? '<span class="text-xs font-bold text-yellow-400 bg-yellow-500/10 px-3 py-1.5 rounded-xl">Completed</span>' : '<span class="text-xs font-semibold text-slate-500">Locked</span>'}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function checkAchievementsAndRewards() {
            let newlyUnlocked = false;
            achievements.forEach(ach => {
                if (!ach.unlocked && highScore >= ach.target) {
                    ach.unlocked = true;
                    newlyUnlocked = true;
                }
            });
            if (newlyUnlocked) {
                const saved = {};
                achievements.forEach(a => { if (a.unlocked) saved[a.id] = true; });
                localStorage.setItem('flappy_ach', JSON.stringify(saved));
            }
        }

        // --- Pipe Class & Management ---
        class Pipe {
            constructor() {
                this.x = width + 50;
                this.topHeight = Math.random() * (height * 0.5) + 80;
                this.bottomY = this.topHeight + pipeGap;
                this.passed = false;
            }
            update() {
                this.x -= gameSpeed;
            }
            draw() {
                const gradientTop = ctx.createLinearGradient(this.x, 0, this.x + pipeWidth, 0);
                gradientTop.addColorStop(0, '#059669');
                gradientTop.addColorStop(0.5, '#34d399');
                gradientTop.addColorStop(1, '#047857');

                // Top Pipe
                ctx.fillStyle = gradientTop;
                ctx.fillRect(this.x, 0, pipeWidth, this.topHeight);
                // Pipe Cap Top
                ctx.fillRect(this.x - 4, this.topHeight - 24, pipeWidth + 8, 24);

                // Bottom Pipe
                ctx.fillRect(this.x, this.bottomY, pipeWidth, height - this.bottomY);
                // Pipe Cap Bottom
                ctx.fillRect(this.x - 4, this.bottomY, pipeWidth + 8, 24);

                // Pipe Highlights / Borders
                ctx.strokeStyle = '#065f46';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, 0, pipeWidth, this.topHeight);
                ctx.strokeRect(this.x, this.bottomY, pipeWidth, height - this.bottomY);
            }
        }

        // --- Main Game Loop ---
        function update() {
            if (gameState === 'PLAYING') {
                // Bird physics
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;

                // Bird rotation calculation
                bird.targetRotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity / 12)));
                bird.rotation += (bird.targetRotation - bird.rotation) * 0.2;

                // Pipe spawn
                pipeTimer++;
                if (pipeTimer > pipeInterval) {
                    pipes.push(new Pipe());
                    pipeTimer = 0;
                }

                // Update pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();

                    // Score check
                    if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                        pipes[i].passed = true;
                        score++;
                        document.getElementById('hudScore').innerText = score;
                        playSound('score');
                    }

                    // Precise Collision Detection
                    // Circle-Rectangle collision for top pipe & bottom pipe
                    const p = pipes[i];
                    
                    // Check bounds for top pipe body and cap
                    if (
                        bird.x + bird.radius > p.x &&
                        bird.x - bird.radius < p.x + pipeWidth &&
                        (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > p.bottomY)
                    ) {
                        gameOver();
                    }

                    // Remove off-screen pipes
                    if (p.x + pipeWidth < -100) {
                        pipes.splice(i, 1);
                    }
                }

                // Floor & Ceiling collision
                if (bird.y + bird.radius >= height - 40 || bird.y - bird.radius <= 0) {
                    gameOver();
                }
            }

            // Update background elements
            backgroundElements.forEach(el => {
                el.x -= el.speed;
                if (el.x < -100) el.x = width + 100;
            });

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Dynamic Background Gradient (Sky)
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#0f172a');
            bgGradient.addColorStop(0.7, '#1e293b');
            bgGradient.addColorStop(1, '#334155');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Draw Background Clouds / Stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            backgroundElements.forEach(el => {
                ctx.beginPath();
                ctx.arc(el.x, el.y, el.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Pipes
            pipes.forEach(p => p.draw());

            // Draw Ground Floor
            const groundGradient = ctx.createLinearGradient(0, height - 40, 0, height);
            groundGradient.addColorStop(0, '#10b981');
            groundGradient.addColorStop(1, '#047857');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, height - 40, width, 40);

            // Ground stripe details
            ctx.fillStyle = '#065f46';
            ctx.fillRect(0, height - 40, width, 8);

            // Draw Particles
            particles.forEach(p => p.draw(context = ctx));

            // Draw Bird
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);

            const activeSkin = skins.find(s => s.id === currentSkinId) || skins[0];

            // Bird Body Shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;

            // Main Body
            ctx.fillStyle = activeSkin.color;
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();

            // Belly patch
            ctx.fillStyle = activeSkin.belly;
            ctx.beginPath();
            ctx.arc(4, 4, bird.radius * 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.fillStyle = activeSkin.belly;
            ctx.beginPath();
            ctx.ellipse(-4, 2, 8, 5, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            // Eye White
            ctx.shadowBlur = 0; // reset shadow for crisp details
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(8, -5, 6, 0, Math.PI * 2);
            ctx.fill();

            // Pupil
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(10, -5, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(12, -2);
            ctx.lineTo(22, 2);
            ctx.lineTo(12, 6);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
